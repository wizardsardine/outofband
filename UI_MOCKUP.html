    // events at the element — warn only; real JS errors carry message/error.

        e.target.tagName, String(e.target.src || e.target.href || ''));

    const templateEl = document.querySelector('script[type="__bundler/template"]');

      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https

    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.

    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;

    window.addEventListener('message', function (e) {

      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss

          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];

      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];

            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }

            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.

            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);

        console.error('Failed to decode asset ' + uuid + ':', err);

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {

    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);

      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

def73cc\") format('woff2'); font-weight: 600; font-style: normal; font-display: swap; }\n@font-face { font-family: 'IBM Plex Sans'; src: url(\"5e5c1053-77da-4cd9-8820-2333594ae1bf\") format('woff2'); font-weight: 700; font-style: normal; font-display: swap; }\n\n@font-face { font-family: 'IBM Plex Mono'; src: url(\"5306882c-ffe2-439e-848e-7629c8966dbf\") format('woff2'); font-weight: 300; font-style: normal; font-display: swap; }\n@font-face { font-family: 'IBM Plex Mono'; src: url(\"3165c430-d0fb-45b1-ae84-fa25d328e40c\") format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }\n@font-face { font-family: 'IBM Plex Mono'; src: url(\"5e71ba19-a03c-4578-86ba-d73d5604f9fa\") format('woff2'); font-weight: 500; font-style: normal; font-display: swap; }\n@font-face { font-family: 'IBM Plex Mono'; src: url(\"b4437fcf-3f5e-4ded-af36-b6111120794b\") format('woff2'); font-weight: 600; font-style: normal; font-display: swap; }\n@font-face { font-family: 'IBM Plex Mono'; src: url(\"7eb87ffa-ea73-45a5-9fc4-8d3d0e58661f\") format('woff2'); font-weight: 700; font-style: normal; font-display: swap; }\n\n@font-face { font-family: 'Satoshi'; src: url(\"3810d0ad-20c0-4dc7-adfc-cb305ff42871\") format('woff'); font-weight: 300; font-style: normal; font-display: swap; }\n@font-face { font-family: 'Satoshi'; src: url(\"8165ee05-61bf-41a8-bf79-6630ffa1fa3b\") format('woff'); font-weight: 400; font-style: normal; font-display: swap; }\n@font-face { font-family: 'Satoshi'; src: url(\"281be2b2-f0b2-4340-8de0-0442560cf854\") format('woff'); font-weight: 500; font-style: normal; font-display: swap; }\n@font-face { font-family: 'Satoshi'; src: url(\"45a9e088-74e8-41d8-a055-67c0ef944527\") format('woff'); font-weight: 700; font-style: normal; font-display: swap; }\n@font-face { font-family: 'Satoshi'; src: url(\"472038b7-e6c3-4630-828f-a947c7ef7e6d\") format('woff'); font-weight: 900; font-style: normal; font-display: swap; }\n\n@font-face { font-family: 'Poppins'; src: url(\"f7591c25-f559-450f-9ed4-d443abeccd3c\") format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }\n@font-face { font-family: 'Poppins'; src: url(\"153d5c49-e33d-4408-82b0-24636ad95d8b\") format('woff2'); font-weight: 500; font-style: normal; font-display: swap; }\n@font-face { font-family: 'Poppins'; src: url(\"aa636f60-b85a-4f62-96ec-853e31578afd\") format('woff2'); font-weight: 600; font-style: normal; font-display: swap; }\n@font-face { font-family: 'Poppins'; src: url(\"9c6e6a61-717b-4281-8b98-030ed565be83\") format('woff2'); font-weight: 700; font-style: normal; font-display: swap; }\n\n:root {\n  /* ==========================================================================\n     2. COLOR TOKENS\n     ========================================================================== */\n\n  /* --- Liana brand (flagship product) --------------------------------------\n     Black + signal-green. The green is reserved for accents, signal &\n     interactive states — never large fills of body copy. */\n  --liana-green:        #00ff66;  /* primary signal green */\n  --liana-lime-green:   #8fff71;  /* secondary lime */\n  --liana-light-green:  #9beb85;  /* muted active green (nav active) */\n  --liana-black:        #141414;  /* product black */\n  --liana-grey:         #cccccc;\n  --liana-light-grey:   #e6e6e6;  /* light section bg */\n\n  /* Liana green gradient (used on big gradient titles) */\n  --liana-gradient: linear-gradient(90deg, #2fc8a2 9.11%, #19d263 43.33%, #0f6 77.55%); /* @kind color */\n\n  /* --- Wizardsardine brand (parent company) --------------------------------\n     Cyan→blue→purple cosmic gradient. Two halves: \"green\" (cyan) + \"purple\". */\n  --ws-purple:    #853cff;\n  --ws-green:     #5fe7e4;  /* WS cyan-green */\n  --ws-gradient:  linear-gradient(231.49deg,#61ffe1 32.13%,#5fe7e4 44.13%,#5ccbe8 52.39%,#59a4ee 60.64%,#5572f5 69.65%,#5133ff 79.4%,#6e38ff 95.16%,#a341ff 103.41%); /* @kind color */\n  --ws-gradient-green:  linear-gradient(237deg,#61ffe1 0%,#5fe7e4 50%,#5ccbe8 70%,#59a4ee 100%); /* @kind color */\n  --ws-gradient-purple: linear-gradient(237deg,#5433ff 0%,#6e38ff 40%,#853cff 60%,#a341ff 80%,#ac43ff 100%); /* @kind color */\n  --light-blue:    #b0def0;  /* WS link / hover accent */\n  --lighter-blue:  #c3dfea;\n\n  /* --- Revault brand (legacy / on-hold) ------------------------------------ */\n  --revault-gradient: linear-gradient(44.91deg,#ef445f -5.12%,#ff8415 92.6%); /* @kind color */\n  --revault-red:    #ef445f;\n  --revault-orange: #ff8415;\n\n  /* --- Neutrals / greys (shared) ------------------------------------------- */\n  --black:        #000000;\n  --near-black:   #0c0c0c;  /* WS card surface */\n  --ink:          #141414;  /* app canvas / product black */\n  --grey-header:  #1d1d1d;  /* nav bar */\n  --surface-1:    #181818;  /* top nav strip */\n  --surface-2:    #2c2c2c;  /* dark section / app card */\n  --surface-3:    #373737;  /* grey-darker */\n  --grey-darker:  #373737;\n  --grey:         #7b7b7b;  /* muted text */\n  --grey-mid:     #909090;  /* WS body copy */\n  --grey-light:   #a1a1a1;  /* liana body copy */\n  --lightgrey:    #f5f5f5;\n  --white:        #f4f4f4;  /* off-white text */\n  --pure-white:   #ffffff;\n\n  /* --- Semantic roles ------------------------------------------------------ */\n  --fg-1:        #f4f4f4;   /* primary text on dark */\n  --fg-2:        #a1a1a1;   /* secondary text on dark */\n  --fg-3:        #7b7b7b;   /* tertiary / captions */\n  --fg-on-light: #141414;   /* primary text on light bg */\n  --accent:      #00ff66;   /* primary action / signal */\n  --accent-ink:  #141414;   /* text on accent */\n  --link:        #b0def0;   /* link / hover on WS surfaces */\n  --border-subtle: #3c3c3c; /* card / divider border on dark */\n  --border-faint:  #2a2a2a;\n\n  /* ==========================================================================\n     3. TYPE TOKENS\n     ========================================================================== */\n  --font-sans:    'IBM Plex Sans', system-ui, sans-serif;  /* primary */\n  --font-mono:    'IBM Plex Mono', ui-monospace, monospace; /* brand / amounts */\n  --font-display: 'Satoshi', 'IBM Plex Sans', sans-serif;   /* WS company display */\n  --font-revault: 'Poppins', sans-serif;                    /* legacy */\n\n  --weight-extralight: 200;\n  --weight-light:      300;\n  --weight-regular:    400;\n  --weight-medium:     500;\n  --weight-semibold:   600;\n  --weight-bold:       700;\n  --weight-black:      900;\n\n  /* ==========================================================================\n     4. RADIUS / SPACING / ELEVATION\n     ========================================================================== */\n  --radius-xs:   2px;    /* WS sharp buttons */\n  --radius-sm:   5px;    /* WS service cards */\n  --radius-md:   12px;   /* app cards / modals */\n  --radius-lg:   20px;   /* rounded media */\n  --radius-xl:   40px;   /* greybox / feature cards */\n  --radius-pill: 38px;   /* Liana pill buttons */\n  --radius-full: 999px;\n\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 20px;\n  --space-6: 24px;\n  --space-8: 32px;\n  --space-10: 40px;\n  --space-12: 60px;\n  --space-16: 100px;\n\n  --shadow-card:  2px 4px 10px 0 rgba(0,0,0,0.15);\n  --shadow-pop:   0 8px 30px 0 rgba(0,0,0,0.35);\n  --glow-green:   0 0 0 1px var(--liana-green), 0 0 12px rgba(0,255,102,0.25);\n}\n\n/* ============================================================================\n   5. SEMANTIC TYPE CLASSES — Liana product scale (IBM Plex Sans)\n   62.5% root in source means rem≈10px; values below are absolute px.\n   ============================================================================ */\n.ds-eyebrow {\n  font-family: var(--font-sans); font-weight: var(--weight-medium);\n  font-size: 20px; line-height: 1.46; letter-spacing: 1.2px; text-transform: uppercase;\n}\n.ds-h1 { /* hero / banner title */\n  font-family: var(--font-sans); font-weight: var(--weight-bold);\n  font-size: 87px; line-height: 1.11; letter-spacing: -0.87px;\n}\n.ds-h2 { /* section title */\n  font-family: var(--font-sans); font-weight: var(--weight-bold);\n  font-size: 52px; line-height: 1.05;\n}\n.ds-h2-gradient {\n  font-family: var(--font-sans); font-weight: var(--weight-bold);\n  font-size: 64px; line-height: 1.5; letter-spacing: -0.64px;\n  background: var(--liana-gradient); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;\n}\n.ds-h3 { /* sub-title */\n  font-family: var(--font-sans); font-weight: var(--weight-bold);\n  font-size: 42px; line-height: 1.16; letter-spacing: -0.43px;\n}\n.ds-h4 { font-family: var(--font-sans); font-weight: var(--weight-semibold); font-size: 24px; line-height: 1.08; }\n.ds-body-lg { font-family: var(--font-sans); font-weight: var(--weight-regular); font-size: 18px; line-height: 1.47; color: var(--fg-2); }\n.ds-body { font-family: var(--font-sans); font-weight: var(--weight-regular); font-size: 16px; line-height: 1.44; }\n.ds-caption { font-family: var(--font-sans); font-weight: var(--weight-regular); font-size: 14px; line-height: 1.4; color: var(--fg-3); }\n.ds-mono { font-family: var(--font-mono); font-weight: var(--weight-regular); font-size: 15px; letter-spacing: 0.2px; }\n\n/* Wizardsardine company headline (Satoshi/Plex, heavy) */\n.ds-ws-h1 { font-family: var(--font-sans); font-weight: var(--weight-bold); font-size: 120px; line-height: 1.1; letter-spacing: -1.6px; text-align: center; }\n.ds-ws-h2 { font-family: var(--font-sans); font-weight: var(--weight-black); font-size: 52px; line-height: 1.13; letter-spacing: 0.01em; }\n\n/* Gradient text helpers */\n.ds-text-ws-green  { background: var(--ws-gradient-green);  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }\n.ds-text-ws-purple { background: var(--ws-gradient-purple); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }\n<\u002Fstyle>\n<script src=\"aca1fcf6-a493-403e-bc33-304f223f5fa1\"><\u002Fscript>\n<style>\nhtml,body{margin:0;background:#000;-webkit-font-smoothing:antialiased}\na{color:#b0def0;text-decoration:none}\na:hover{color:#5fe7e4}\ntextarea::placeholder,input::placeholder{color:#454545}\ntextarea:focus,input:focus{outline:none;border-color:#5fe7e4}\nbutton{transition:all .2s ease-in-out}\n@keyframes wspulse{0%,100%{opacity:.35}50%{opacity:1}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;background:#000;color:#f4f4f4;font-family:'IBM Plex Sans',system-ui,sans-serif\">\n\n<div style=\"position:sticky;top:0;z-index:20;background:rgba(0,0,0,.94);border-bottom:1px solid #1a1a1a\">\n<div style=\"padding:0 6%\">\n<div style=\"max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:14px;height:42px\">\n<span style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:500;letter-spacing:1.6px;text-transform:uppercase;color:#7b7b7b;white-space:nowrap\">Security disclosure<\u002Fspan>\n<span style=\"width:1px;height:14px;background:#2a2a2a\"><\u002Fspan>\n<a href=\"https://wizardsardine.com/blog/coldcard-rng-vulnerability/\" target=\"_blank\" style=\"display:flex;align-items:center;gap:8px;font-size:13.5px;color:#b0def0;text-decoration:none;white-space:nowrap\" style-hover=\"color:#5fe7e4\"><span style=\"text-decoration:underline;text-decoration-color:#4a6470;text-underline-offset:3px\">Coldcard RNG vulnerability, and why you might need this tool<\u002Fspan><svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none\"><path d=\"M7 17 17 7\"><\u002Fpath><path d=\"M9 7h8v8\"><\u002Fpath><\u002Fsvg><\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"padding:0 6%\"><div style=\"max-width:1280px;margin:0 auto\">\n\n<div style=\"border:1px solid #2a2a2a;border-left:3px solid #5fe7e4;border-radius:2px;background:#0c0c0c;padding:18px 26px;margin-top:16px\">\n<p style=\"margin:0;font-size:14.5px;line-height:1.6;color:#a1a1a1;max-width:96ch;text-wrap:pretty\">This tool exists because of a specific failure: keys generated with predictable randomness can be recovered by anyone who notices. If that is your situation, moving the coins is a race, and the public mempool is where you lose it. <a href=\"https://wizardsardine.com/blog/coldcard-rng-vulnerability/\" target=\"_blank\" style=\"font-weight:600\">Read the disclosure ›<\u002Fa><\u002Fp>\n<\u002Fdiv>\n\n<div style=\"{{ heroGrid }}\">\n<div>\n<div style=\"font-size:13px;font-weight:500;letter-spacing:1.6px;text-transform:uppercase;color:#7b7b7b;margin-bottom:24px\">Send directly to the miner<\u002Fdiv>\n<h1 style=\"{{ h1Style }}\">\n<span style=\"background:linear-gradient(237deg,#61ffe1 0%,#5fe7e4 50%,#5ccbe8 70%,#59a4ee 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent\">Get your transactions<\u002Fspan><br>\n<span style=\"background:linear-gradient(237deg,#5433ff 0%,#6e38ff 40%,#853cff 60%,#a341ff 80%,#ac43ff 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent\">mined directly.<\u002Fspan>\n<\u002Fh1>\n<div style=\"display:flex;flex-wrap:wrap;gap:9px;margin-top:32px\">\n<span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.5px;color:#a1a1a1;border:1px solid #2a2a2a;border-radius:2px;padding:7px 11px\">PSBT · base64<\u002Fspan>\n<span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.5px;color:#a1a1a1;border:1px solid #2a2a2a;border-radius:2px;padding:7px 11px\">RAW TX · hex<\u002Fspan>\n<span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.5px;color:#a1a1a1;border:1px solid #2a2a2a;border-radius:2px;padding:7px 11px\">.TXT .PSBT .TXN .TAR.GZ .ZIP<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"{{ feeCardStyle }}\">\n<div style=\"font-size:12px;font-weight:500;letter-spacing:1.6px;text-transform:uppercase;color:#7b7b7b\">Minimum accepted fee rate<\u002Fdiv>\n<div style=\"display:flex;align-items:baseline;gap:14px;margin-top:12px\">\n<span style=\"{{ feeNumStyle }}\">{{ minFeeRate }}<\u002Fspan>\n<span style=\"font-family:'IBM Plex Mono',monospace;font-size:22px;color:#a1a1a1\">sat/vB<\u002Fspan>\n<\u002Fdiv>\n<div style=\"height:1px;background:#1f1f1f;margin:26px 0 20px\"><\u002Fdiv>\n<p style=\"margin:0;font-size:14px;line-height:1.6;color:#909090;text-wrap:pretty\">Anything below this rate is rejected, not queued.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"padding:60px 0 0\">\n<div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:18px\">\n<div>\n<h2 style=\"margin:0;font-size:26px;font-weight:600;letter-spacing:-.2px\">Load transactions<\u002Fh2>\n<p style=\"margin:7px 0 0;font-size:13.5px;line-height:1.55;color:#7b7b7b;max-width:70ch\">Paste or drop signed PSBTs and raw transactions. We hand each one to MARA Slipstream, which mines it without ever touching the public mempool.<\u002Fp>\n<\u002Fdiv>\n<span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.6px;color:#6a6a6a\">{{ detectedLabel }}<\u002Fspan>\n<\u002Fdiv>\n\n<textarea sc-camel-on-input=\"{{ onRawInput }}\" sc-camel-on-key-down=\"{{ onRawKey }}\" sc-camel-on-drag-over=\"{{ onTaDragOver }}\" sc-camel-on-drag-leave=\"{{ onTaDragLeave }}\" sc-camel-on-drop=\"{{ onTaDrop }}\" value=\"{{ rawText }}\" spellcheck=\"false\" placeholder=\"cHNidP8BAHECAAAAAf8Zj1... \n\nor\n\n02000000000101ef51e1b804cc89d182d279655c3aa89e815b1b309fe287d9b2b55d57b90ec68a...\n\nor drop a file here\" style=\"{{ taStyle }}\"><\u002Ftextarea>\n\n<div style=\"display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:16px\">\n<button sc-camel-on-click=\"{{ onQueue }}\" style=\"{{ queueBtnStyle }}\" style-hover=\"{{ primaryHover }}\">{{ queueLabel }}<\u002Fbutton>\n<button sc-camel-on-click=\"{{ onPick }}\" style=\"display:flex;align-items:center;gap:9px;border:1px solid #2a2a2a;border-radius:2px;background:#000;color:#a1a1a1;font-family:inherit;font-size:13px;padding:13px 18px;cursor:pointer\" style-hover=\"border-color:#5fe7e4;color:#5fe7e4\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 16V4\"><\u002Fpath><path d=\"m7 9 5-5 5 5\"><\u002Fpath><path d=\"M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2\"><\u002Fpath><\u002Fsvg>Choose files<\u002Fbutton>\n<input ref=\"{{ fileRef }}\" sc-camel-on-change=\"{{ onFiles }}\" type=\"file\" multiple=\"{{ true }}\" accept=\".txt,.psbt,.txn,.hex,.raw,.tar,.gz,.tgz,.zip\" style=\"display:none\">\n<span style=\"font-size:12.5px;color:#6a6a6a\">Files, folders or archives: .txt .psbt .txn .tar .tar.gz .zip<\u002Fspan>\n<sc-if value=\"{{ hasItems }}\" hint-placeholder-val=\"{{ false }}\">\n<button sc-camel-on-click=\"{{ onClearAll }}\" style=\"border:0;background:none;color:#6a6a6a;font-family:inherit;font-size:13px;cursor:pointer;padding:14px 4px\" style-hover=\"color:#b0def0\">Clear queue<\u002Fbutton>\n<\u002Fsc-if>\n<\u002Fdiv>\n\n<sc-if value=\"{{ hasParseError }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"margin-top:18px;border:1px solid #4a2230;border-left:3px solid #ef445f;border-radius:2px;background:#120a0d;padding:16px 20px\">\n<div style=\"font-size:11.5px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:#ef445f\">Could not parse<\u002Fdiv>\n<p style=\"margin:7px 0 0;font-size:13.5px;line-height:1.55;color:#c9a8b0;font-family:'IBM Plex Mono',monospace\">{{ parseError }}<\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n\n<sc-if value=\"{{ hasItems }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"padding:44px 0 0\">\n\n<div style=\"{{ statsGrid }}\">\n<div style=\"{{ statCell0 }}\">\n<div style=\"font-size:11px;font-weight:500;letter-spacing:1.4px;text-transform:uppercase;color:#7b7b7b\">In queue<\u002Fdiv>\n<div style=\"font-family:'IBM Plex Mono',monospace;font-size:28px;font-weight:600;margin-top:6px\">{{ countAll }}<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"{{ statCell1 }}\">\n<div style=\"font-size:11px;font-weight:500;letter-spacing:1.4px;text-transform:uppercase;color:#7b7b7b\">Clear the floor<\u002Fdiv>\n<div style=\"font-family:'IBM Plex Mono',monospace;font-size:28px;font-weight:600;margin-top:6px;color:#61ffe1\">{{ countPass }}<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"{{ statCell2 }}\">\n<div style=\"font-size:11px;font-weight:500;letter-spacing:1.4px;text-transform:uppercase;color:#7b7b7b\">Below floor<\u002Fdiv>\n<div style=\"font-family:'IBM Plex Mono',monospace;font-size:28px;font-weight:600;margin-top:6px;color:#ef445f\">{{ countFail }}<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"{{ statCell3 }}\">\n<div style=\"font-size:11px;font-weight:500;letter-spacing:1.4px;text-transform:uppercase;color:#7b7b7b\">Needs input value<\u002Fdiv>\n<div style=\"font-family:'IBM Plex Mono',monospace;font-size:28px;font-weight:600;margin-top:6px;color:#a1a1a1\">{{ countUnknown }}<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"{{ statsCtaStyle }}\">\n<button sc-camel-on-click=\"{{ onBroadcastAll }}\" disabled=\"{{ broadcastDisabled }}\" style=\"{{ broadcastStyle }}\" style-hover=\"{{ primaryHover }}\">{{ broadcastLabel }}<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"border:1px solid #2a2a2a;border-radius:0 0 44px 2px;background:#0c0c0c;overflow:hidden\">\n<div style=\"{{ tableHeadStyle }}\">\n<span><\u002Fspan><span>Source<\u002Fspan><span>Format<\u002Fspan><span style=\"text-align:right\">vsize<\u002Fspan><span style=\"text-align:right\">Fee rate<\u002Fspan><span style=\"text-align:right\">Status<\u002Fspan><span><\u002Fspan>\n<\u002Fdiv>\n\n<sc-for list=\"{{ items }}\" as=\"it\" hint-placeholder-count=\"3\">\n<div style=\"{{ it.rowStyle }}\">\n<div style=\"{{ rowGrid }}\">\n<span style=\"{{ it.dotStyle }}\"><\u002Fspan>\n<div style=\"{{ nameCellStyle }}\">\n<div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:#f4f4f4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ it.name }}<\u002Fdiv>\n<div style=\"font-size:11.5px;color:#6a6a6a;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ it.origin }}<\u002Fdiv>\n<\u002Fdiv>\n<span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.5px;color:#a1a1a1;border:1px solid #2a2a2a;border-radius:2px;padding:4px 8px;justify-self:start\">{{ it.format }}<\u002Fspan>\n<span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:#a1a1a1;text-align:right\">{{ it.vsizeStr }}<\u002Fspan>\n<div style=\"text-align:right\">\n<div style=\"font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:600;color:{{ it.rateColor }}\">{{ it.rateStr }}<\u002Fdiv>\n<div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#6a6a6a;margin-top:2px\">{{ it.feeSub }}<\u002Fdiv>\n<\u002Fdiv>\n<span style=\"font-size:12px;font-weight:500;text-align:right;color:{{ it.statusColor }}\">{{ it.statusLabel }}<\u002Fspan>\n<button sc-camel-on-click=\"{{ it.remove }}\" style=\"border:0;background:none;color:#4a4a4a;font-size:17px;line-height:1;cursor:pointer;padding:4px\" style-hover=\"color:#ef445f\">×<\u002Fbutton>\n<\u002Fdiv>\n\n<sc-if value=\"{{ it.needsValue }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:14px 0 0 42px;padding:14px 18px;border:1px dashed #2a2a2a;border-radius:2px;background:#060606\">\n<span style=\"font-size:13px;color:#909090;max-width:52ch;line-height:1.5\">A raw transaction carries no input amounts, so the fee cannot be derived locally. Enter the total value being spent to check it before submitting.<\u002Fspan>\n<input sc-camel-on-input=\"{{ it.setTotal }}\" placeholder=\"total input sats\" style=\"flex:1;min-width:150px;background:#000;border:1px solid #2a2a2a;border-radius:2px;color:#e6e6e6;font-family:'IBM Plex Mono',monospace;font-size:13px;padding:10px 12px\">\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ it.hasNote }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"{{ it.noteStyle }}\">{{ it.note }}<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ it.hasTxid }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;align-items:center;gap:12px;margin:14px 0 0 42px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:#61ffe1;word-break:break-all\">\n<span style=\"color:#6a6a6a;letter-spacing:.6px\">TXID<\u002Fspan>{{ it.txid }}\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<div style=\"padding:76px 0 0\">\n<div style=\"font-size:13px;font-weight:500;letter-spacing:1.6px;text-transform:uppercase;color:#7b7b7b;margin-bottom:26px\">Questions you should ask before using this<\u002Fdiv>\n<div style=\"border:1px solid #2a2a2a;border-radius:22px 2px 22px 2px;background:#0c0c0c;overflow:hidden\">\n<sc-for list=\"{{ faqs }}\" as=\"q\" hint-placeholder-count=\"4\">\n<div style=\"{{ q.wrapStyle }}\">\n<button sc-camel-on-click=\"{{ q.toggle }}\" style=\"width:100%;display:flex;align-items:center;justify-content:space-between;gap:20px;text-align:left;border:0;background:none;color:#f4f4f4;font-family:inherit;font-size:14px;font-weight:600;line-height:1.25;padding:6px 20px;cursor:pointer\" style-hover=\"color:#5fe7e4\">\n<span>{{ q.question }}<\u002Fspan>\n<span style=\"{{ q.iconStyle }}\">\n<svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m6 9 6 6 6-6\"><\u002Fpath><\u002Fsvg>\n<\u002Fspan>\n<\u002Fbutton>\n<sc-if value=\"{{ q.open }}\" hint-placeholder-val=\"{{ false }}\">\n<p style=\"margin:0;padding:0 20px 10px;font-size:13.5px;line-height:1.65;color:#909090;max-width:90ch;text-wrap:pretty\">{{ q.answer }}<\u002Fp>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:center;padding:56px 0 64px;margin-top:60px;border-top:1px solid #1a1a1a\">\n<span style=\"font-size:13px;color:#6a6a6a\">Built by <a href=\"https://wizardsardine.com\" target=\"_blank\">Wizardsardine<\u002Fa><\u002Fspan>\n<div style=\"display:flex;gap:22px;font-size:13px\">\n<a href=\"https://wizardsardine.com/blog/coldcard-rng-vulnerability/\" target=\"_blank\">Disclosure<\u002Fa>\n<a href=\"#\">Slipstream terms<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst ARCHIVE_RE = /\\.(tar|tar\\.gz|tgz|zip)$/i;\nconst B64_RE = /^[A-Za-z0-9+/=]+$/;\nconst HEX_RE = /^[0-9a-fA-F]+$/;\n\nfunction b64bytes(s) {\n  const bin = atob(s.replace(/\\s+/g, ''));\n  const out = new Uint8Array(bin.length);\n  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);\n  return out;\n}\nfunction hexbytes(s) {\n  const t = s.replace(/\\s+/g, '');\n  const out = new Uint8Array(t.length / 2);\n  for (let i = 0; i < out.length; i++) out[i] = parseInt(t.substr(i * 2, 2), 16);\n  return out;\n}\nclass R {\n  constructor(b) { this.b = b; this.p = 0; }\n  u8() { return this.b[this.p++]; }\n  u16() { const v = this.b[this.p] | (this.b[this.p + 1] << 8); this.p += 2; return v; }\n  u32() { const v = (this.b[this.p] | (this.b[this.p + 1] << 8) | (this.b[this.p + 2] << 16) | (this.b[this.p + 3] << 24)) >>> 0; this.p += 4; return v; }\n  u64() { let v = 0n; for (let i = 0; i < 8; i++) v |= BigInt(this.b[this.p + i]) << BigInt(8 * i); this.p += 8; return Number(v); }\n  varint() { const n = this.u8(); if (n < 0xfd) return n; if (n === 0xfd) return this.u16(); if (n === 0xfe) return this.u32(); return this.u64(); }\n  take(n) { const s = this.b.subarray(this.p, this.p + n); this.p += n; return s; }\n  get left() { return this.b.length - this.p; }\n}\n\n// Returns {baseSize, totalSize, vsize, nIn, nOut, outSum, segwit}\nfunction parseTx(bytes) {\n  const r = new R(bytes);\n  r.u32();\n  let segwit = false;\n  if (r.b[r.p] === 0x00 && r.b[r.p + 1] === 0x01) { segwit = true; r.p += 2; }\n  const nIn = r.varint();\n  if (!nIn || nIn > 5000) throw new Error('bad input count');\n  for (let i = 0; i < nIn; i++) { r.take(32); r.u32(); r.take(r.varint()); r.u32(); }\n  const nOut = r.varint();\n  if (nOut > 5000) throw new Error('bad output count');\n  let outSum = 0;\n  for (let i = 0; i < nOut; i++) { outSum += r.u64(); r.take(r.varint()); }\n  let witBytes = 0;\n  if (segwit) {\n    const start = r.p;\n    for (let i = 0; i < nIn; i++) { const n = r.varint(); for (let j = 0; j < n; j++) r.take(r.varint()); }\n    witBytes = r.p - start + 2;\n  }\n  r.u32();\n  const totalSize = r.p;\n  const baseSize = totalSize - witBytes;\n  const weight = baseSize * 3 + totalSize;\n  return { baseSize, totalSize, vsize: Math.ceil(weight / 4), nIn, nOut, outSum, segwit };\n}\n\nfunction parsePsbt(bytes) {\n  const r = new R(bytes);\n  const m = r.take(5);\n  if (!(m[0] === 0x70 && m[1] === 0x73 && m[2] === 0x62 && m[3] === 0x74 && m[4] === 0xff)) throw new Error('missing PSBT magic');\n  let unsigned = null;\n  while (r.left > 0) {\n    const kl = r.varint();\n    if (kl === 0) break;\n    const key = r.take(kl);\n    const val = r.take(r.varint());\n    if (key[0] === 0x00) unsigned = val;\n  }\n  if (!unsigned) throw new Error('no unsigned transaction in global map');\n  const tx = parseTx(unsigned);\n  let inSum = 0, known = 0, finalized = 0, witnessInputs = 0;\n  for (let i = 0; i < tx.nIn && r.left > 0; i++) {\n    while (r.left > 0) {\n      const kl = r.varint();\n      if (kl === 0) break;\n      const key = r.take(kl);\n      const val = r.take(r.varint());\n      const t = key[0];\n      if (t === 0x01) { const rr = new R(val); inSum += rr.u64(); known++; witnessInputs++; }\n      else if (t === 0x00) { try { const prev = parseTx(val); const rr = new R(val); void rr; known++; inSum += prev.outSum; } catch (e) { /* ignore */ } }\n      else if (t === 0x07 || t === 0x08) finalized++;\n    }\n  }\n  const estWitness = tx.nIn * 108;\n  const totalSize = tx.baseSize + estWitness + 2;\n  const vsize = Math.ceil((tx.baseSize * 3 + totalSize) / 4);\n  return {\n    nIn: tx.nIn, nOut: tx.nOut, outSum: tx.outSum, inSum,\n    inputsKnown: known, finalized, vsize,\n    estimated: true,\n    fullySigned: finalized >= tx.nIn\n  };\n}\n\nfunction classify(text) {\n  const t = (text || '').trim().replace(/\\s+/g, '');\n  if (!t) return null;\n  if (t.startsWith('cHNidP') && B64_RE.test(t)) return 'psbt';\n  if (HEX_RE.test(t) && t.length >= 40 && t.length % 2 === 0) {\n    if (t.toLowerCase().startsWith('70736274ff')) return 'psbt-hex';\n    return 'raw';\n  }\n  if (B64_RE.test(t) && t.length > 60) return 'psbt';\n  return null;\n}\n\nconst SAMPLE_PSBT = 'cHNidP8BAHECAAAAAZvyIzXiaLNRYNcabxdvHo8Bqmjw+kk4RCF06U9zbXAgAAAAAAD9////AoCWmAAAAAAAFgAU7cHm2Iq5xNkbYFhGGnpc07AZoRIYnDgAAAAAABYAFOgLpwGuBS3TCyt4hM7Qxq0OeuGwAAAAAAABAR8A4fUFAAAAABYAFPjBhWtiFOb2AasqTUvCFsWWWJf4AQhrAkcwRAIgUOA5oEHXPeQyFrCVJKGRT0nJ3v5aVWtJVvQwUqJTgN0CIC5C0yuGZ8trE1YRUhV/hZmDTiFTeGWQUC5rWzOwOLKtASEC7pQlwFTHwqRJvbFqUJ7v0BOr1UDOh2LDBQaBBOoy0jEAAAA=';\n\nfunction b64encode(bytes) {\n  let s = '';\n  for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);\n  return btoa(s);\n}\n// Rewrite the first input's witness_utxo amount so the derived fee rate lands on `rate`.\nfunction psbtAtRate(b64, rate) {\n  try {\n    const bytes = b64bytes(b64);\n    const p = parsePsbt(bytes);\n    const r = new R(bytes);\n    r.take(5);\n    while (r.left > 0) { const kl = r.varint(); if (kl === 0) break; r.take(kl); r.take(r.varint()); }\n    let off = -1;\n    while (r.left > 0) {\n      const kl = r.varint();\n      if (kl === 0) break;\n      const key = r.take(kl);\n      const vl = r.varint();\n      const vo = r.p;\n      r.take(vl);\n      if (key[0] === 0x01) { off = vo; break; }\n    }\n    if (off < 0) return b64;\n    let v = p.outSum + Math.round(rate * p.vsize);\n    const out = bytes.slice();\n    for (let i = 0; i < 8; i++) { out[off + i] = v & 0xff; v = Math.floor(v / 256); }\n    return b64encode(out);\n  } catch (e) { return b64; }\n}\nconst SAMPLE_PSBT_OK = psbtAtRate(SAMPLE_PSBT, 7.8);\nconst SAMPLE_PSBT_TIGHT = psbtAtRate(SAMPLE_PSBT, 5.4);\nconst SAMPLE_PSBT_LOW = psbtAtRate(SAMPLE_PSBT, 2.1);\nconst SAMPLE_RAW = '02000000000101d6f0e6dd2b0f4c1a5b0d8f21e39a4d5c6b7e8f90a1b2c3d4e5f60718293a4b5c0000000000fdffffff0210270000000000001600149a7f0b6c5d4e3f2a1b0c9d8e7f6a5b4c3d2e1f0090d0030000000000160014b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f708192a02473044022012ab34cd56ef7890abcdef1234567890abcdef1234567890abcdef123456789002205678abcdef1234567890abcdef1234567890abcdef1234567890abcdef12345601210279be667ef9dcbbac55a06295ce870b07029bfcdb2dce28d959f2815b16f8179800000000';\n\nclass Component extends DCLogic {\n  state = {\n    openFaq: -1,\n    rawText: '',\n    items: [],\n    error: '',\n    dragging: false,\n    taDragging: false,\n    seq: 1,\n    broadcasting: false\n  };\n\n  componentDidMount() {\n    this._mq = window.matchMedia('(max-width: 860px)');\n    this._onMq = () => this.setState({ mobile: this._mq.matches });\n    this._onMq();\n    this._mq.addEventListener('change', this._onMq);\n    this._prevent = (e) => { e.preventDefault(); };\n    window.addEventListener('dragover', this._prevent);\n    window.addEventListener('drop', this._prevent);\n  }\n  componentWillUnmount() {\n    if (this._mq) this._mq.removeEventListener('change', this._onMq);\n    window.removeEventListener('dragover', this._prevent);\n    window.removeEventListener('drop', this._prevent);\n  }\n\n  minFee() { return this.props.minFeeRate ?? 5; }\n\n  makeItem(text, name, origin) {\n    const kind = classify(text);\n    const id = 'i' + (this.state.seq + Math.random());\n    const base = { id, name, origin, status: 'ready', txid: '', totalIn: null, note: '', noteKind: '' };\n    if (!kind) return { ...base, format: 'UNKNOWN', vsize: 0, feeRate: null, fee: null, status: 'invalid', note: 'Not valid base64 PSBT or hex transaction data.', noteKind: 'error' };\n    try {\n      if (kind === 'psbt' || kind === 'psbt-hex') {\n        const bytes = kind === 'psbt' ? b64bytes(text) : hexbytes(text);\n        const p = parsePsbt(bytes);\n        const fee = p.inputsKnown >= p.nIn ? p.inSum - p.outSum : null;\n        const rate = fee === null ? null : fee / p.vsize;\n        let note = '', noteKind = '';\n        if (!p.fullySigned) { note = 'Not fully signed: ' + p.finalized + ' of ' + p.nIn + ' inputs finalized. Sign it before broadcasting.'; noteKind = 'warn'; }\n        else { note = 'Finalized locally: ' + p.nIn + ' input' + (p.nIn > 1 ? 's' : '') + ' to ' + p.nOut + ' output' + (p.nOut > 1 ? 's' : '') + ', ready to extract.'; noteKind = 'ok'; }\n        if (fee === null) { note = 'Missing UTXO data for ' + (p.nIn - p.inputsKnown) + ' input(s). Fee cannot be derived.'; noteKind = 'warn'; }\n        return { ...base, format: 'PSBT', vsize: p.vsize, estimated: true, fee, feeRate: rate, note, noteKind, signed: p.fullySigned, nIn: p.nIn };\n      }\n      const bytes = hexbytes(text);\n      const t = parseTx(bytes);\n      return { ...base, format: 'RAW TX', vsize: t.vsize, estimated: false, fee: null, feeRate: null, outSum: t.outSum, nIn: t.nIn, note: '', noteKind: '' };\n    } catch (e) {\n      return { ...base, format: kind === 'raw' ? 'RAW TX' : 'PSBT', vsize: 0, feeRate: null, fee: null, status: 'invalid', note: 'Malformed: ' + e.message, noteKind: 'error' };\n    }\n  }\n\n  addTexts(entries) {\n    const added = [];\n    let err = '';\n    entries.forEach(([text, name, origin]) => {\n      const it = this.makeItem(text, name, origin);\n      if (it.status === 'invalid' && entries.length === 1) err = it.note;\n      add
