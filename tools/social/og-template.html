<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'IBM Plex Sans'; src: url("FONTDIR/ibm-plex-sans-400.woff2") format('woff2'); font-weight: 400; }
  @font-face { font-family: 'IBM Plex Sans'; src: url("FONTDIR/ibm-plex-sans-600.woff2") format('woff2'); font-weight: 600; }
  @font-face { font-family: 'IBM Plex Sans'; src: url("FONTDIR/ibm-plex-sans-700.woff2") format('woff2'); font-weight: 700; }
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; background: #000; color: #f4f4f4;
    font-family: 'IBM Plex Sans', sans-serif; overflow: hidden;
    display: flex; flex-direction: column; justify-content: center; gap: 54px;
    padding: 64px 72px;
  }
  h1 { font-size: 66px; font-weight: 700; line-height: 1.05; letter-spacing: -1.8px; }
  .teal {
    background: linear-gradient(237deg,#61ffe1 0%,#5fe7e4 50%,#5ccbe8 70%,#59a4ee 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .violet {
    background: linear-gradient(237deg,#5433ff 0%,#6e38ff 40%,#853cff 60%,#a341ff 80%,#ac43ff 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  /* The audience line is the point of the card: who should click. Bigger than
     body copy, quieter than the headline, so the two read in order. */
  .who {
    font-size: 41px; font-weight: 400; line-height: 1.3; letter-spacing: -.5px;
    color: #9a9a9a; border-left: 4px solid #2a2a2a; padding-left: 32px;
  }
  .who b { color: #f4f4f4; font-weight: 600; }
</style>
</head>
<body>
  <h1>
    <span class="teal">Get your transactions</span><br>
    <span class="violet">mined directly, without<br>using the public mempool.</span>
  </h1>

  <p class="who">
    For <b>multisig</b>, <b>Miniscript</b> and <b>Liana</b> users<br>
    affected by the <b>Coldcard security issue</b>.
  </p>
</body>
</html>
